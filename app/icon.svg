<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The Patina mark: the same field twice, once clean and once varnished.
       A disc rather than a framed rectangle, because at 16 pixels a picture
       inside a frame turns to porridge and a split disc does not. -->
  <rect width="48" height="48" rx="7" fill="#0b0b0c"/>
  <path d="M24 7a17 17 0 0 0 0 34z" fill="#efe9dc"/>
  <path d="M24 7a17 17 0 0 1 0 34z" fill="#a9761f"/>
  <rect x="23.3" y="7" width="1.4" height="34" fill="#c9a227"/>
  <circle cx="24" cy="24" r="17" fill="none" stroke="#c9a227" stroke-width="1.6"/>
</svg>
